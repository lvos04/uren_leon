# Alternatief voor het TrueNAS-formulier (Apps -> Discover Apps -> ⋮ -> Install via YAML).
# Alleen het pad naar je dataset aanpassen. Wachtwoord en alle andere instellingen regel je in de web-app.
services:
  uren:
    image: ghcr.io/lvos04/uren_leon:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - /mnt/tank/apps/uren:/data
