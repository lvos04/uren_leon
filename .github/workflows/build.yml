name: Build

# Bouwt de Android-app en de server-image (met de app erin) en zet die op ghcr.io.
# Geen secrets nodig: de app-sleutel staat in android/signing.
on:
  push:
    paths: ["server/**", "android/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: APK + versie klaarzetten
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/uren.apk
          echo "{\"versionCode\": $((1 + GITHUB_RUN_NUMBER)), \"versionName\": \"1.${GITHUB_RUN_NUMBER}\"}" > out/version.json
      - uses: actions/upload-artifact@v4
        with: { name: uren-apk, path: android/out/ }

  server:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uren-apk, path: server/apk }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
        working-directory: server
      - run: pytest -q
        working-directory: server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:build-${{ github.run_number }}
